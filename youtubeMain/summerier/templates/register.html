{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet" href="{% static 'css/regicss.css' %}">

</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    {% if form.errors %}

        <div class="error">
            {{ form.errors }}
        </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>

    </form>

    <p>

        Already have an account?

        <a href="{% url 'login' %}">

            Login

        </a>

    </p>

</div>

</body>

</html>
